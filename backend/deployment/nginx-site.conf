# ========================================
# Nginx Configuration for CanvaStencil
# Customer Quote & Approval Workflow
# ========================================
#
# Installation:
# 1. Copy to /etc/nginx/sites-available/stencil
# 2. Update server_name and paths
# 3. Create symlink: sudo ln -s /etc/nginx/sites-available/stencil /etc/nginx/sites-enabled/
# 4. Test config: sudo nginx -t
# 5. Reload: sudo systemctl reload nginx
#
# ========================================

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;
    
    # Redirect all HTTP requests to HTTPS
    return 301 https://$server_name$request_uri;
}

# Main HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;
    
    root /var/www/stencil/frontend/dist;
    index index.html;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Logging
    access_log /var/log/nginx/stencil-access.log;
    error_log /var/log/nginx/stencil-error.log;
    
    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
    
    # Client Body Size (for file uploads)
    client_max_body_size 10M;
    
    # API Backend (Laravel)
    location /api {
        alias /var/www/stencil/backend/public;
        try_files $uri $uri/ @api;
        
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
            fastcgi_param SCRIPT_FILENAME /var/www/stencil/backend/public/index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTPS on;
            fastcgi_read_timeout 300;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
        }
    }
    
    location @api {
        rewrite /api/(.*)$ /api/index.php?/$1 last;
    }
    
    # Storage (Private Files - Requires Authentication)
    location /storage {
        alias /var/www/stencil/backend/storage/app/public;
        internal;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Frontend Static Assets
    location /assets {
        alias /var/www/stencil/frontend/dist/assets;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Frontend Images
    location /images {
        alias /var/www/stencil/frontend/dist/images;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Frontend SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to sensitive files
    location ~ /\.env {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ /composer\.(json|lock) {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ /package(-lock)?\.json {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Health Check Endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
    
    # Robots
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
}

