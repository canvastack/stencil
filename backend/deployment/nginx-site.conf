# ========================================
# Rate Limiting Configuration
# ========================================
# Add to nginx.conf http block:

# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
# limit_req_zone $binary_remote_addr zone=customer_limit:10m rate=60r/m;
# limit_req_zone $binary_remote_addr zone=customer_action_limit:10m rate=10r/m;

# Then use in location blocks:
# location /api/v1/tenant {
#     limit_req zone=api_limit burst=20 nodelay;
#     ...
# }
# 
# location /api/v1/public/customer-quotes {
#     limit_req zone=customer_limit burst=10 nodelay;
#     ...
# }

# ========================================
# Performance Tuning
