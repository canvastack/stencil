# Supervisor Configuration for CanvaStencil Queue Workers
# Customer Quote & Approval Workflow
#
# Installation:
# 1. Copy this file to /etc/supervisor/conf.d/stencil-worker.conf
# 2. Update the paths and user as needed
# 3. Run: sudo supervisorctl reread
# 4. Run: sudo supervisorctl update
# 5. Run: sudo supervisorctl start stencil-worker:*

[program:stencil-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/stencil/backend/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=300
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/stencil/backend/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600
startsecs=0

# Environment variables
environment=LARAVEL_ENV="production"

# Priority
priority=999

# Restart policy
startretries=3
exitcodes=0,2

# Logging
stderr_logfile=/var/www/stencil/backend/storage/logs/worker-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

# ========================================
# Additional Worker Groups (Optional)
# ========================================

# High Priority Queue Worker
[program:stencil-worker-high]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/stencil/backend/artisan queue:work redis --queue=high,default --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/stencil/backend/storage/logs/worker-high.log
stopwaitsecs=3600

# Email Queue Worker (Dedicated)
[program:stencil-worker-email]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/stencil/backend/artisan queue:work redis --queue=emails --sleep=3 --tries=3 --max-time=1800
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/stencil/backend/storage/logs/worker-email.log
stopwaitsecs=1800

# Document Generation Worker (Dedicated)
[program:stencil-worker-documents]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/stencil/backend/artisan queue:work redis --queue=documents --sleep=3 --tries=3 --max-time=1800
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/stencil/backend/storage/logs/worker-documents.log
stopwaitsecs=1800

# ========================================
# Management Commands
# ========================================
#
# Start all workers:
#   sudo supervisorctl start stencil-worker:*
#
# Stop all workers:
#   sudo supervisorctl stop stencil-worker:*
#
# Restart all workers:
#   sudo supervisorctl restart stencil-worker:*
#
# Check status:
#   sudo supervisorctl status stencil-worker:*
#
# View logs:
#   sudo supervisorctl tail -f stencil-worker:stencil-worker_00 stdout
#
# Reload configuration:
#   sudo supervisorctl reread
#   sudo supervisorctl update
