CustomerQuote:
  type: object
  properties:
    id:
      type: integer
      description: Internal database ID
    uuid:
      type: string
      format: uuid
      description: Public UUID identifier
    tenant_id:
      type: integer
    order_id:
      type: integer
    vendor_quote_id:
      type: integer
    quote_number:
      type: string
      example: "CQ-202402-0001"
    title:
      type: string
    description:
      type: string
      nullable: true
    vendor_total_cost:
      type: integer
      description: Vendor cost in cents
    base_profit_amount:
      type: integer
      description: Base profit in cents
    base_profit_percentage:
      type: number
      format: float
    handling_fee:
      type: integer
      description: Handling fee in cents
    shipping_cost:
      type: integer
      description: Shipping cost in cents
    insurance:
      type: integer
      description: Insurance in cents
    other_costs:
      type: integer
      description: Other costs in cents
    other_costs_description:
      type: string
      nullable: true
    subtotal:
      type: integer
      description: Subtotal in cents
    tax_rate:
      type: number
      format: float
    tax_amount:
      type: integer
      description: Tax amount in cents
    grand_total:
      type: integer
      description: Grand total in cents
    total_profit_amount:
      type: integer
      description: Total profit in cents
    total_profit_percentage:
      type: number
      format: float
    currency:
      type: string
      default: "IDR"
    valid_until:
      type: string
      format: date-time
    payment_terms:
      type: string
    delivery_timeline:
      type: string
      nullable: true
    terms_and_conditions:
      type: string
      nullable: true
    status:
      type: string
      enum: [draft, sent, viewed, countered, pending_approval, accepted, rejected, expired]
    sent_at:
      type: string
      format: date-time
      nullable: true
    viewed_at:
      type: string
      format: date-time
      nullable: true
    responded_at:
      type: string
      format: date-time
      nullable: true
    approved_at:
      type: string
      format: date-time
      nullable: true
    rejected_at:
      type: string
      format: date-time
      nullable: true
    expired_at:
      type: string
      format: date-time
      nullable: true
    created_by:
      type: integer
    approved_by:
      type: integer
      nullable: true
    rejected_by:
      type: integer
      nullable: true
    counter_offer_amount:
      type: integer
      nullable: true
      description: Counter offer amount in cents
    counter_offer_notes:
      type: string
      nullable: true
    counter_offer_round:
      type: integer
      default: 0
    max_negotiation_rounds:
      type: integer
      default: 3
    approval_method:
      type: string
      enum: [auto, manual]
      nullable: true
    approval_reason:
      type: string
      nullable: true
    approval_notes:
      type: string
      nullable: true
    response_token:
      type: string
      format: uuid
    history:
      type: array
      items:
        $ref: '#/components/schemas/QuoteHistoryEntry'
    metadata:
      type: object
      additionalProperties: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    order:
      $ref: '#/components/schemas/Order'
    vendor_quote:
      $ref: '#/components/schemas/VendorQuote'

QuoteHistoryEntry:
  type: object
  properties:
    action:
      type: string
      enum: [quote_created, quote_sent, quote_viewed, customer_accepted, customer_rejected, customer_counter_offer, admin_approved, admin_rejected, counter_offer_accepted, counter_offer_rejected, admin_counter_offer, quote_expired]
    actor_type:
      type: string
      enum: [admin, customer, system]
    actor_id:
      type: integer
      nullable: true
    timestamp:
      type: string
      format: date-time
    old_value:
      type: object
      nullable: true
    new_value:
      type: object
      nullable: true
    notes:
      type: string
      nullable: true
    metadata:
      type: object
      nullable: true

ApprovalSettings:
  type: object
  properties:
    id:
      type: integer
    tenant_id:
      type: integer
    auto_approval_enabled:
      type: boolean
      default: false
    auto_approval_threshold:
      type: integer
      description: Threshold in cents
      default: 5000000
    require_email_verification:
      type: boolean
      default: true
    min_successful_orders:
      type: integer
      default: 1
    min_payment_success_rate:
      type: number
      format: float
      default: 90.0
    auto_approve_standard_products:
      type: boolean
      default: true
    require_approval_custom_products:
      type: boolean
      default: true
    max_negotiation_rounds:
      type: integer
      default: 3
    allow_customer_counter_offer:
      type: boolean
      default: true
    notify_admin_on_auto_approve:
      type: boolean
      default: true
    notify_admin_on_pending_approval:
      type: boolean
      default: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

OrderDocument:
  type: object
  properties:
    id:
      type: integer
    uuid:
      type: string
      format: uuid
    tenant_id:
      type: integer
    order_id:
      type: integer
    document_type:
      type: string
      enum: [quotation, proforma_invoice, tax_invoice, purchase_order, delivery_note, receipt, completion_certificate]
    document_number:
      type: string
    document_date:
      type: string
      format: date
    customer_quote_id:
      type: integer
      nullable: true
    vendor_quote_id:
      type: integer
      nullable: true
    payment_id:
      type: integer
      nullable: true
    title:
      type: string
    description:
      type: string
      nullable: true
    file_url:
      type: string
      format: uri
    file_size:
      type: integer
    file_type:
      type: string
    version:
      type: integer
      default: 1
    parent_document_id:
      type: integer
      nullable: true
    is_latest_version:
      type: boolean
      default: true
    status:
      type: string
      enum: [draft, sent, acknowledged, paid, delivered, completed, cancelled]
    generated_at:
      type: string
      format: date-time
    sent_at:
      type: string
      format: date-time
      nullable: true
    acknowledged_at:
      type: string
      format: date-time
      nullable: true
    completed_at:
      type: string
      format: date-time
      nullable: true
    generated_by:
      type: integer
    sent_by:
      type: integer
      nullable: true
    acknowledged_by:
      type: integer
      nullable: true
    recipient_type:
      type: string
      enum: [customer, vendor, internal]
      nullable: true
    recipient_id:
      type: integer
      nullable: true
    recipient_email:
      type: string
      format: email
      nullable: true
    metadata:
      type: object
      additionalProperties: true
    access_log:
      type: array
      items:
        type: object
        properties:
          accessed_by:
            type: integer
          accessed_at:
            type: string
            format: date-time
          ip_address:
            type: string
          action:
            type: string
            enum: [view, download, email]
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    deleted_at:
      type: string
      format: date-time
      nullable: true
