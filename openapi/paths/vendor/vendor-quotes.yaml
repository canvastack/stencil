# Vendor Quotes - Reject
/api/v1/vendor/quotes/{quote_uuid}/reject:
  post:
    tags:
      - Vendor Portal - Quotes
    summary: Reject Quote
    description: |
      Reject a quote with rejection reason.
      
      **Architecture Context:**
      - Controller → RejectQuoteUseCase → QuoteRepository
      - Validates quote can be responded to
      - Validates vendor ownership
      - Updates quote status to 'rejected'
      - Records responded_at timestamp
      - Stores rejection reason in quote details
      - Sends notifications to admins
      - Logs action to audit trail
      - Dispatches QuoteRejectedEvent
      
      **Business Rules:**
      - Quote must be in 'sent' or 'pending_response' status
      - Quote must not be expired
      - Quote must not have been responded to already
      - Rejection reason is required (max 500 chars)
      
      **Related Use Case:** RejectQuoteUseCase
      **Command:** RejectQuoteCommand
      **Domain Event:** QuoteRejectedEvent
    operationId: rejectVendorQuote
    security:
      - VendorAuth: []
    parameters:
      - name: quote_uuid
        in: path
        required: true
        description: Quote UUID
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - rejection_reason
            properties:
              rejection_reason:
                type: string
                minLength: 1
                maxLength: 500
                description: Reason for rejecting the quote
                example: "We cannot meet the required specifications with our current equipment"
    responses:
      '200':
        description: Quote rejected successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: '../../schemas/vendor/vendor-quotes.yaml#/QuoteDetail'
                message:
                  type: string
                  example: "Quote rejected successfully"
      '400':
        description: Bad request - quote cannot be rejected
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: false
                error:
                  type: object
                  properties:
                    code:
                      type: string
                      enum: [QUOTE_EXPIRED, QUOTE_ALREADY_RESPONDED, INVALID_STATUS]
                      example: "QUOTE_ALREADY_RESPONDED"
                    message:
                      type: string
                      example: "This quote has already been responded to"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/UnauthorizedError'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/ForbiddenError'
      '404':
        description: Quote not found
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/NotFoundError'
      '422':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/ValidationError'

# Vendor Quotes - Counter Offer
/api/v1/vendor/quotes/{quote_uuid}/counter-offer:
  post:
    tags:
      - Vendor Portal - Quotes
    summary: Submit Counter Offer
    description: |
      Submit a counter offer with alternative pricing.
      
      **Architecture Context:**
      - Controller → CounterOfferQuoteUseCase → QuoteRepository
      - Validates quote can be responded to
      - Validates vendor ownership
      - Updates quote status to 'countered'
      - Records responded_at timestamp
      - Increments round number
      - Updates latest_offer with counter amount
      - Sends notifications to admins
      - Logs action to audit trail
      - Dispatches QuoteCounterOfferedEvent
      
      **Business Rules:**
      - Quote must be in 'sent' or 'pending_response' status
      - Quote must not be expired
      - Quote must not have been responded to already
      - Counter offer amount must be positive
      
      **Related Use Case:** CounterOfferQuoteUseCase
      **Command:** CounterOfferQuoteCommand
      **Domain Event:** QuoteCounterOfferedEvent
    operationId: counterOfferVendorQuote
    security:
      - VendorAuth: []
    parameters:
      - name: quote_uuid
        in: path
        required: true
        description: Quote UUID
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - counter_offer_amount
            properties:
              counter_offer_amount:
                type: number
                format: double
                minimum: 0.01
                description: Counter offer amount in cents
                example: 150000
              notes:
                type: string
                maxLength: 1000
                description: Optional notes explaining the counter offer
                example: "We can offer this price if we use alternative materials that meet the same quality standards"
    responses:
      '200':
        description: Counter offer submitted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: '../../schemas/vendor/vendor-quotes.yaml#/QuoteDetail'
                message:
                  type: string
                  example: "Counter offer submitted successfully"
      '400':
        description: Bad request - quote cannot receive counter offer
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: false
                error:
                  type: object
                  properties:
                    code:
                      type: string
                      enum: [QUOTE_EXPIRED, QUOTE_ALREADY_RESPONDED, INVALID_STATUS]
                      example: "QUOTE_EXPIRED"
                    message:
                      type: string
                      example: "This quote has expired and cannot receive a counter offer"
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/UnauthorizedError'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/ForbiddenError'
      '404':
        description: Quote not found
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/NotFoundError'
      '422':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '../../components/responses.yaml#/ValidationError'
