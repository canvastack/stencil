                    sent_at: "2026-02-10T10:00:00Z"
                    expires_at: "2026-02-17T10:00:00Z"
                    responded_at: "2026-02-10T14:30:00Z"
                    is_expired: false
                    unread_message_count: 0
                    order_status: "customer_quote"
                    order_status_label: "Customer Quote"
                    production_progress:
                      accepted_date: "2026-02-10T14:30:00Z"
                      expected_delivery_date: "2026-02-24T14:30:00Z"
                      days_elapsed: 4
                      days_remaining: 10
