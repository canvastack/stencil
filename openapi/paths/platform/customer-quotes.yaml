# Document Generation
/api/v1/tenant/{tenant}/documents/generate:
  post:
    summary: Generate document
    description: Generate a document (quotation, invoice, etc.) for an order
    tags:
      - Documents
    security:
      - bearerAuth: []
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - document_type
              - customer_quote_id
            properties:
              document_type:
                type: string
                enum: [quotation, proforma_invoice, tax_invoice, purchase_order, delivery_note, receipt]
              customer_quote_id:
                type: integer
    responses:
      '201':
        description: Document generated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                data:
                  $ref: '#/components/schemas/OrderDocument'
