# Customer Quote Management API Endpoints

/api/v1/tenant/{tenant}/customer-quotes:
  get:
    summary: List customer quotes
    description: Retrieve a paginated list of customer quotes for the tenant
    tags:
      - Customer Quotes
    security:
      - bearerAuth: []
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
        description: Tenant identifier
      - name: page
        in: query
        schema:
          type: integer
          default: 1
        description: Page number
      - name: per_page
        in: query
        schema:
          type: integer
          default: 15
        description: Items per page
      - name: status
        in: query
        schema:
          type: string
          enum: [draft, sent, viewed, countered, pending_approval, accepted, rejected, expired]
        description: Filter by quote status
      - name: search
        in: query
        schema:
          type: string
        description: Search by quote number or customer name
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/CustomerQuote'
                meta:
                  type: object
                  properties:
                    current_page:
                      type: integer
                    total:
                      type: integer
                    per_page:
                      type: integer
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'

  post:
    summary: Create customer quote
    description: Create a new customer quote from an accepted vendor quote
    tags:
      - Customer Quotes
    security:
      - bearerAuth: []
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - order_id
              - vendor_quote_id
              - valid_until
              - payment_terms
            properties:
              order_id:
                type: integer
              vendor_quote_id:
                type: integer
              handling_fee:
                type: integer
                description: Handling fee in cents
              shipping_cost:
                type: integer
                description: Shipping cost in cents
              insurance:
                type: integer
                description: Insurance cost in cents
              other_costs:
                type: integer
                description: Other costs in cents
              other_costs_description:
                type: string
              valid_until:
                type: string
                format: date-time
              payment_terms:
                type: string
              delivery_timeline:
                type: string
              terms_and_conditions:
                type: string
    responses:
      '201':
        description: Quote created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/CustomerQuote'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '422':
        $ref: '#/components/responses/ValidationError'

/api/v1/tenant/{tenant}/customer-quotes/{id}:
  get:
    summary: Get customer quote details
    description: Retrieve detailed information about a specific customer quote
    tags:
      - Customer Quotes
    security:
      - bearerAuth: []
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/CustomerQuote'
      '404':
        $ref: '#/components/responses/NotFound'

  put:
    summary: Update customer quote
    description: Update an existing customer quote (draft only)
    tags:
      - Customer Quotes
    security:
      - bearerAuth: []
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              handling_fee:
                type: integer
              shipping_cost:
                type: integer
              insurance:
                type: integer
              other_costs:
                type: integer
              other_costs_description:
                type: string
              valid_until:
                type: string
                format: date-time
              payment_terms:
                type: string
              delivery_timeline:
                type: string
              terms_and_conditions:
                type: string
    responses:
      '200':
        description: Quote updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/CustomerQuote'
      '400':
        $ref: '#/components/responses/BadRequest'
      '404':
        $ref: '#/components/responses/NotFound'

/api/v1/tenant/{tenant}/customer-quotes/{id}/send:
  post:
    summary: Send quote to customer
    description: Send the customer quote via email with portal link
    tags:
      - Customer Quotes
    security:
      - bearerAuth: []
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Quote sent successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                data:
                  $ref: '#/components/schemas/CustomerQuote'
      '400':
        $ref: '#/components/responses/BadRequest'
      '404':
        $ref: '#/components/responses/NotFound'

# Customer Portal Endpoints (Public)
/api/v1/public/customer-quotes/token/{token}:
  get:
    summary: View quote by token
    description: Customer views quote using unique token from email
    tags:
      - Customer Portal
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/CustomerQuote'
      '404':
        $ref: '#/components/responses/NotFound'
      '410':
        description: Quote expired
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: "This quote has expired"

/api/v1/public/customer-quotes/token/{token}/accept:
  post:
    summary: Accept quote
    description: Customer accepts the quote (triggers approval workflow)
    tags:
      - Customer Portal
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - terms_accepted
            properties:
              terms_accepted:
                type: boolean
              notes:
                type: string
    responses:
      '200':
        description: Quote accepted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                approval_status:
                  type: string
                  enum: [auto_approved, pending_approval]
                data:
                  $ref: '#/components/schemas/CustomerQuote'
      '400':
        $ref: '#/components/responses/BadRequest'
      '404':
        $ref: '#/components/responses/NotFound'

/api/v1/public/customer-quotes/token/{token}/counter-offer:
  post:
    summary: Submit counter offer
    description: Customer submits a counter offer with different price
    tags:
      - Customer Portal
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - counter_amount
              - reason
            properties:
              counter_amount:
                type: integer
                description: Counter offer amount in cents
              reason:
                type: string
                minLength: 20
              additional_requests:
                type: string
    responses:
      '200':
        description: Counter offer submitted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                data:
                  $ref: '#/components/schemas/CustomerQuote'
      '400':
        $ref: '#/components/responses/BadRequest'
      '404':
        $ref: '#/components/responses/NotFound'

/api/v1/public/customer-quotes/token/{token}/reject:
  post:
    summary: Reject quote
    description: Customer rejects the quote with reason
    tags:
      - Customer Portal
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - reason
            properties:
              reason:
                type: string
                enum: [price_too_high, delivery_too_long, changed_requirements, found_alternative, other]
              notes:
                type: string
    responses:
      '200':
        description: Quote rejected successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                data:
                  $ref: '#/components/schemas/CustomerQuote'
      '400':
        $ref: '#/components/responses/BadRequest'
      '404':
        $ref: '#/components/responses/NotFound'

# Approval Management
/api/v1/tenant/{tenant}/approvals/pending:
  get:
    summary: Get pending approvals
    description: Retrieve list of quotes pending manual approval
    tags:
      - Approvals
    security:
      - bearerAuth: []
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/CustomerQuote'

/api/v1/tenant/{tenant}/approvals/{id}/approve:
  post:
    summary: Approve quote
    description: Admin approves a pending quote acceptance
    tags:
      - Approvals
    security:
      - bearerAuth: []
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: integer
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              notes:
                type: string
              payment_due_date:
                type: string
                format: date
    responses:
      '200':
        description: Quote approved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                data:
                  $ref: '#/components/schemas/CustomerQuote'

/api/v1/tenant/{tenant}/approvals/{id}/reject:
  post:
    summary: Reject quote approval
    description: Admin rejects a pending quote acceptance
    tags:
      - Approvals
    security:
      - bearerAuth: []
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - reason
            properties:
              reason:
                type: string
                minLength: 20
    responses:
      '200':
        description: Quote approval rejected
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                data:
                  $ref: '#/components/schemas/CustomerQuote'

# Negotiation Management
/api/v1/tenant/{tenant}/negotiations/{id}/respond:
  post:
    summary: Respond to counter offer
    description: Admin responds to customer counter offer
    tags:
      - Negotiations
    security:
      - bearerAuth: []
    parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - action
            properties:
              action:
                type: string
                enum: [accept, reject, counter]
              new_amount:
                type: integer
                description: Required if action is 'counter'
              notes:
                type: string
    responses:
      '200':
        description: Response sent successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                data:
                  $ref: '#/components/schemas/CustomerQuote'

